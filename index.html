<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Teena &amp; Vishnu — Wedding Invitation</title>
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <script src="./editable/wedding-data.js"></script>
    <style>
      #music-control {
        position: fixed;
        top: 1.25rem;
        right: 1.25rem;
        z-index: 9999;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-family: inherit;
        pointer-events: auto;
      }
      #music-btn {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        padding: 0.45rem 0.85rem;
        border-radius: 9999px;
        background: rgba(6, 32, 24, 0.82);
        border: 1px solid rgba(225, 190, 120, 0.55);
        color: #e1be78;
        cursor: pointer;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        transition: all 0.3s ease;
        outline: none;
        font-size: 0.68rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        user-select: none;
      }
      #music-btn:hover {
        background: rgba(10, 48, 36, 0.95);
        border-color: rgba(225, 190, 120, 0.9);
        box-shadow: 0 0 20px rgba(225, 190, 120, 0.4);
        transform: translateY(-1px);
      }
      .music-disc-icon {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
        transition: transform 0.3s ease;
      }
      #music-btn.playing .music-disc-icon {
        animation: music-spin 4s linear infinite;
      }
      @keyframes music-spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @media (max-width: 640px) {
        #music-control {
          top: 1rem;
          right: 1rem;
        }
        #music-btn {
          padding: 0.4rem 0.75rem;
          font-size: 0.62rem;
        }
      }
    </style>
    <script>
      window.addEventListener('DOMContentLoaded', function() {
        var START_AT = 17; // skip the lead-in, start at the melody

        var wrapper = document.createElement('div');
        wrapper.id = 'music-control';
        wrapper.innerHTML = [
          '<audio id="wedding-audio" loop preload="auto"></audio>',
          '<button id="music-btn" type="button" aria-label="Toggle background music" title="Background Music">',
          '  <svg class="music-disc-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">',
          '    <circle cx="12" cy="12" r="10"></circle>',
          '    <circle cx="12" cy="12" r="3"></circle>',
          '    <path d="M12 2a10 10 0 0 1 10 10" stroke="#e1be78" stroke-width="2.5"></path>',
          '  </svg>',
          '  <span id="music-label">Play Music</span>',
          '</button>'
        ].join('');
        document.body.appendChild(wrapper);

        var audio = document.getElementById('wedding-audio');
        var btn = document.getElementById('music-btn');
        var label = document.getElementById('music-label');
        var started = false;   // playback has succeeded at least once
        var starting = false;  // a play() attempt is in flight

        // Track list: the editable data file wins, baked-in files are fallbacks.
        var configured = [];
        try {
          var cfg = window.WEDDING_DATA && window.WEDDING_DATA.music;
          if (cfg && cfg.src) configured.push(cfg.src);
        } catch (err) {}
        var seen = {};
        configured.concat([
          './the_rose.mp3',
          './editable/assets/the_rose.mp3',
          './tvbg.mp3',
          './editable/assets/tvbg.mp3',
          './tvbg.mpeg',
          './editable/assets/tvbg.mpeg'
        ]).forEach(function(src) {
          if (!src || seen[src]) return;
          seen[src] = true;
          var el = document.createElement('source');
          el.src = src;
          el.type = 'audio/mpeg';
          audio.appendChild(el);
        });

        function syncUI() {
          var playing = !!audio && !audio.paused && !audio.ended;
          if (btn) {
            btn.classList.toggle('playing', playing);
            btn.setAttribute('aria-pressed', playing ? 'true' : 'false');
          }
          if (label) {
            label.textContent = playing ? 'Music ♫' : (started ? 'Music Paused' : 'Play Music');
          }
        }

        function seekToMelody() {
          if (audio.currentTime >= START_AT) return;
          var duration = audio.duration;
          if (isFinite(duration) && duration <= START_AT + 2) return;
          try { audio.currentTime = START_AT; } catch (err) {}
        }

        function startMusic() {
          if (!audio || starting || !audio.paused) return;
          seekToMelody();
          starting = true;
          audio.play().then(function() {
            started = true;
            detachAutoStart();
            starting = false;
            syncUI();
          }, function(err) {
            // Autoplay blocked (or source problem) — keep the gesture
            // listeners alive so the first tap/keydown still starts it.
            console.log('Music will start on first interaction:', err && err.name);
            starting = false;
            if (!audio.paused) { try { audio.pause(); } catch (e) {} }
            syncUI();
          });
        }

        function toggleAudio() {
          if (!audio) return;
          if (audio.paused) startMusic();
          else audio.pause();
        }

        // Auto-start: listens during the capture phase so app-level
        // stopPropagation() calls cannot swallow the very first gesture.
        var GESTURES = ['pointerdown', 'touchstart', 'mousedown', 'click', 'keydown'];
        function onGesture(e) {
          var t = e && e.target;
          // The music button handles its own clicks (toggle, not auto-start).
          if (t && typeof t.closest === 'function' && t.closest('#music-control')) return;
          startMusic();
        }
        function attachAutoStart() {
          GESTURES.forEach(function(type) {
            document.addEventListener(type, onGesture, true);
          });
        }
        function detachAutoStart() {
          GESTURES.forEach(function(type) {
            document.removeEventListener(type, onGesture, true);
          });
        }

        if (btn) {
          btn.addEventListener('click', function(e) {
            e.stopPropagation();
            toggleAudio();
          });
        }

        if (audio) {
          audio.addEventListener('play', syncUI);
          audio.addEventListener('playing', syncUI);
          audio.addEventListener('pause', syncUI);
          audio.addEventListener('ended', syncUI);
          audio.addEventListener('loadedmetadata', seekToMelody);
          audio.addEventListener('seeked', function() {
            // Restart from the melody instead of the lead-in after looping.
            if (started && audio.currentTime < 0.5) seekToMelody();
          });
        }

        syncUI();
        attachAutoStart();
        startMusic(); // try to play immediately; browsers that block it fall back to the first gesture
      });
    </script>
    <script type="module" crossorigin src="./assets/index-cdc8IQTD.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/styles-xl0qPzWF.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
